<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Builder Pro - Markdown Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Library untuk mengubah Markdown ke HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        /* Styling agar hasil markdown rapi */
        .markdown-content ul { list-style-type: disc; margin-left: 1.25rem; }
        .markdown-content strong { font-weight: 700; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .cv-preview { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            @page { margin: 10mm; }
        }
        .gold-line { height: 4px; background: linear-gradient(90deg, #d4af37 0%, #f9e29d 50%, #d4af37 100%); }
        .cyber-bg { background-color: #23292f !important; }
        .modern-blue { background-color: #1a428a !important; }
        .modern-border { border-bottom: 2px solid #1a428a; width: fit-content; margin-bottom: 10px; }
    </style>
</head>
<body class="bg-gray-200">
    <div id="app" class="container mx-auto py-10 px-4">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- INPUT PANEL -->
            <div class="lg:col-span-4 space-y-6 no-print">
                <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-blue-600">
                    <h2 class="text-xl font-bold mb-4 text-blue-700">✍️ Input Data</h2>
                    <p class="text-[10px] text-gray-500 mb-4">*Gunakan **teks** untuk Bold, *teks* untuk Miring</p>
                    
                    <div class="space-y-4">
                        <input v-model="form.nama" placeholder="Nama Lengkap" class="w-full border p-2 rounded text-sm">
                        <input v-model="form.headline" placeholder="Headline" class="w-full border p-2 rounded text-sm">
                        <input v-model="form.email" placeholder="Email" class="w-full border p-2 rounded text-sm">
                        <input v-model="form.telp" placeholder="No WA" class="w-full border p-2 rounded text-sm">
                        <input v-model="form.alamat" placeholder="Lokasi" class="w-full border p-2 rounded text-sm">
                        
                        <label class="text-xs font-bold">Ringkasan Profil:</label>
                        <textarea v-model="form.tentang" rows="3" placeholder="Contoh: Saya adalah **Profesional**..." class="w-full border p-2 rounded text-sm"></textarea>
                        
                        <label class="text-xs font-bold">Pengalaman Kerja:</label>
                        <textarea v-model="form.pengalaman" rows="5" placeholder="Gunakan - untuk list..." class="w-full border p-2 rounded text-sm"></textarea>
                        
                        <label class="text-xs font-bold">Pendidikan:</label>
                        <textarea v-model="form.pendidikan" rows="3" class="w-full border p-2 rounded text-sm"></textarea>

                        <button @click="simpanData" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Simpan Data</button>
                    </div>
                </div>
            </div>

            <!-- PREVIEW PANEL -->
            <div class="lg:col-span-8 flex justify-center">
                <div class="cv-preview bg-white shadow-2xl w-[210mm] min-h-[297mm]">
                    
                    <!-- Contoh Template Modern (Semua template sudah support markdown) -->
                    <div class="flex flex-col h-full">
                        <div class="modern-blue p-10 flex items-center justify-between text-white">
                            <div class="w-full text-center">
                                <h1 class="text-5xl font-bold uppercase">{{ form.nama || 'NAMA' }}</h1>
                                <p class="text-lg opacity-90 tracking-widest mt-2 uppercase">{{ form.headline }}</p>
                            </div>
                        </div>

                        <div class="p-10 grid grid-cols-12 gap-8 text-gray-800">
                            <div class="col-span-12">
                                <h3 class="text-sm font-black text-blue-900 uppercase modern-border">Profil</h3>
                                <!-- v-html digunakan untuk merender hasil markdown -->
                                <div class="markdown-content text-xs text-justify" v-html="renderMarkdown(form.tentang)"></div>
                            </div>

                            <div class="col-span-12 mt-4">
                                <h3 class="text-sm font-black text-blue-900 uppercase modern-border">Pengalaman Kerja</h3>
                                <div class="markdown-content text-xs leading-relaxed" v-html="renderMarkdown(form.pengalaman)"></div>
                            </div>

                            <div class="col-span-12 mt-4">
                                <h3 class="text-sm font-black text-blue-900 uppercase modern-border">Pendidikan</h3>
                                <div class="markdown-content text-xs" v-html="renderMarkdown(form.pendidikan)"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    form: { nama: '', headline: '', tentang: '', pengalaman: '', pendidikan: '', email: '', telp: '', alamat: '' }
                }
            },
            methods: {
                // Fungsi untuk mengubah teks biasa menjadi HTML Bold/Italic
                renderMarkdown(text) {
                    if (!text) return '';
                    return marked.parse(text); // Menggunakan library Marked.js
                },
                async simpanData() {
                    alert('Data siap dikirim!');
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
